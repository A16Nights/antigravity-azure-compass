<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>苍蓝罗盘 · Agent 预设</title>
<style>
  :root {
    --bg: #131722;
    --card: #1a2030;
    --card-hover: #21283c;
    --border: #2a334a;
    --border-active: #7aa2f7;
    --text: #e6ecf8;
    --muted: #8c98b3;
    --badge-bg: #263047;
    --badge-active-bg: #3b4b72;
    --accent: #7aa2f7;
    --danger: #f7768e;
  }
  [data-theme="light"] {
    --bg: #f4f7fb;
    --card: #ffffff;
    --card-hover: #eef4fc;
    --border: #d5dfec;
    --border-active: #2f6fed;
    --text: #1c2434;
    --muted: #607089;
    --badge-bg: #e8effa;
    --badge-active-bg: #d4e3fc;
    --accent: #2f6fed;
    --danger: #d93855;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 18px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover:not(:disabled) {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  button.primary {
    background: var(--badge-active-bg);
    border-color: var(--accent);
    color: var(--text);
  }
  button.primary:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
  }
  button.danger-btn {
    background: rgba(247, 118, 142, 0.16);
    border-color: var(--danger);
    color: var(--danger);
  }
  button.danger-btn:hover:not(:disabled) {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .icon-btn {
    width: 30px;
    height: 28px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
  }
  .icon-btn:hover:not(:disabled) { color: var(--accent); }
  @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .icon-btn.spinning { animation: spin360 0.65s linear infinite; }
  select:hover, input[type="text"]:hover, textarea:hover { border-color: var(--accent); }
  .toggle-label:hover { color: var(--accent); }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .sentinel-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .sentinel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .sentinel-controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .sentinel-item label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sentinel-item input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .sentinel-item select {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .meter-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .meter-bar {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  .meter-fill.warn { background: #e0af68; }
  .meter-fill.critical { background: var(--danger); }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .section-title {
    color: var(--muted);
    font-size: 12px;
    margin: 14px 0 10px;
    font-weight: 500;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 132px;
  }
  .card:hover {
    background: var(--card-hover);
  }
  .card.card-add {
    border: 1.5px dashed var(--border);
    background: transparent;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
    color: var(--muted);
  }
  .card.card-add:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(122, 162, 247, 0.06);
    transform: translateY(-1px);
  }
  .card-add-icon {
    font-size: 24px;
    line-height: 1;
    font-weight: 400;
  }
  .card-add-title {
    font-size: 13px;
    font-weight: 600;
    color: inherit;
  }
  .card-add-desc {
    font-size: 11px;
    color: var(--muted);
  }
  .card.active {
    border-color: var(--border-active);
    box-shadow: 0 0 0 1px rgba(122, 162, 247, 0.35);
    background: #1d2538;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
  }
  .badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--muted);
  }
  .card.active .badge.active-tag {
    background: var(--badge-active-bg);
    color: #dbe7ff;
  }
  .card-id {
    font-family: Consolas, monospace;
    font-size: 11px;
    color: #6b7897;
  }
  .card-desc {
    color: #b7c2da;
    font-size: 12px;
    margin: 0 0 10px 0;
  }
  .card-footer {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }
  .card-footer .mini-actions {
    display: flex;
    gap: 6px;
  }
  .link-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 2px 4px;
    font-size: 11px;
  }
  .link-btn:hover {
    background: transparent;
    color: var(--text);
  }
  .link-btn.danger:hover {
    color: var(--danger);
  }
  .toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    background: #232c43;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 9000;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--card, #181e2e);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    padding: 16px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
  }
  .modal.confirm-modal { max-width: 390px; }
  .confirm-desc {
    margin: 0 0 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .confirm-note {
    margin: 0 0 4px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .confirm-warn {
    margin: 8px 0 0;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: #e0af68;
    background: rgba(224, 175, 104, 0.12);
    border: 1px solid rgba(224, 175, 104, 0.32);
  }
  .modal h2 { margin: 0 0 12px; font-size: 15px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: inherit;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>苍蓝罗盘 · Agent 预设</h1>
      <p class="subtitle">选择 Agent 的工作方式与底层锚点。切换预设会同步生效于每轮 PreInvocation Hook，并自动联动 soul-md 人设卡。</p>
    </div>
    <div class="actions">
      <button id="btnConfig">打开配置文件</button>
      <button id="btnRefresh" class="icon-btn" title="刷新面板数据">↻</button>
      <button id="btnTheme" class="icon-btn" title="切换明暗主题">☀️</button>
    </div>
  </div>

  <div class="toolbar">
    <label class="toggle-label">
      <input type="checkbox" id="chkReinforce" />
      <span>开启每轮 PreInvocation 前置强化（仅对外接模型生效，Antigravity内部模型自动跳过）</span>
    </label>
    <span id="statusText" style="font-size:11px;color:var(--muted);">加载中...</span>
  </div>

  <div class="sentinel-box">
    <div class="sentinel-head">
      <label class="toggle-label">
        <input type="checkbox" id="chkSentinel" />
        <span><strong>上下文监测</strong>（抢在原生乱压缩前主动提醒 /compact 或蓝汐交接）</span>
      </label>
      <span id="sentinelBadge" class="badge">监测中</span>
    </div>
    <div class="sentinel-controls">
      <div class="sentinel-item">
        <label><span>阶段预警线</span><span id="valWarn">55%</span></label>
        <input type="range" id="rngWarn" min="30" max="85" step="5" value="55" />
      </div>
      <div class="sentinel-item">
        <label><span>红线强提醒</span><span id="valCrit">72%</span></label>
        <input type="range" id="rngCrit" min="45" max="95" step="1" value="72" />
      </div>
      <div class="sentinel-item">
        <label><span>目标窗口基准</span></label>
        <select id="selWindow">
          <option value="128000">128k tokens</option>
          <option value="200000">200k tokens</option>
          <option value="256000">256k tokens</option>
        </select>
      </div>
    </div>
    <div class="meter-wrap">
      <span id="meterLabel">当前会话估算：--</span>
      <div class="meter-bar"><div class="meter-fill" id="meterFill" style="width:0%"></div></div>
    </div>
    <div class="sentinel-controls" style="margin-top:10px;">
      <label class="toggle-label">
        <input type="checkbox" id="chkAutoCompact" />
        <span>自动 /compact 压缩（红线时由 Stop hook 派发）</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="chkAutoExtract" />
        <span>自动提炼入蓝汐（压缩前沉淀增量记忆）</span>
      </label>
    </div>
    <div class="meter-wrap" style="margin-top:8px;align-items:center;">
      <span id="sentinelSignalText" style="flex:1;">监测信号：暂无记录</span>
      <button id="btnResetBreaker" style="flex-shrink:0;">重置熔断</button>
    </div>
  </div>

  <div class="section-title">内置</div>
  <div class="grid" id="builtinGrid"></div>

  <div class="section-title">自定义</div>
  <div class="grid" id="customGrid"></div>

  <div class="sentinel-box" style="margin-top:14px;">
    <div class="sentinel-head">
      <div style="font-weight:600;font-size:13px;">苍蓝套件 · 左侧栏入口管理</div>
      <span id="sidebarNavSummary" class="badge">加载中</span>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;">
      统一控制苍蓝系列插件是否在 Antigravity 左侧栏显示快捷入口（关闭后仍可在右侧栏正常打开）。
    </div>
    <div id="sidebarNavList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h2 id="modalTitle">新建自定义预设</h2>
      <div class="field">
        <label>预设 ID（英文/数字）</label>
        <input id="fId" placeholder="例如：custom-code" />
      </div>
      <div class="field">
        <label>名称</label>
        <input id="fName" placeholder="例如：代码审查模式" />
      </div>
      <div class="field">
        <label>简介</label>
        <input id="fDesc" placeholder="简短说明这个模式的用途" />
      </div>
      <div class="field">
        <label>联动 soul-md 人设卡（留空则不切换）</label>
        <input id="fSoul" placeholder="例如：默认工程助手 或 冷静工程助手" />
      </div>
      <div class="field">
        <label>每轮注入的底层锚点（PreInvocation 提示词）</label>
        <textarea id="fAnchor" placeholder="写明核心身份锚或行为强约束..."></textarea>
      </div>
      <div class="modal-actions">
        <button id="btnCancel">取消</button>
        <button class="primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="confirmModalMask">
    <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">确认删除自定义预设</h2>
      <p class="confirm-desc" id="confirmDesc"></p>
      <p class="confirm-note">删除后将从配置文件中永久移除，无法撤销。</p>
      <p class="confirm-warn" id="confirmActiveWarn" style="display:none;">该预设当前正在生效，删除后将自动切回「标准模式」。</p>
      <div class="modal-actions">
        <button id="btnConfirmCancel">取消</button>
        <button class="danger-btn" id="btnConfirmOk">确认删除</button>
      </div>
    </div>
  </div>

<script>
let state = { activeId: "", perTurnReinforce: true, presets: [] };

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(path, opts = {}) {
  const tok = new URLSearchParams(location.search).get("token") || "";
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (tok) headers["X-Codeium-Sidecar-Token"] = tok;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

function renderCard(p) {
  const isActive = p.id === state.activeId;
  const card = document.createElement("div");
  card.className = "card" + (isActive ? " active" : "");
  card.onclick = () => activatePreset(p.id);

  const badgeText = isActive ? "当前生效" : (p.group === "builtin" ? "内置" : "自定义");
  const badgeClass = isActive ? "badge active-tag" : "badge";

  card.innerHTML = `
    <div>
      <div class="card-top">
        <div class="card-title-wrap">
          <span class="card-title">${escapeHtml(p.name)}</span>
          <span class="${badgeClass}">${badgeText}</span>
        </div>
        <span class="card-id">${escapeHtml(p.id)}</span>
      </div>
      <p class="card-desc">${escapeHtml(p.description || "")}</p>
    </div>
    <div class="card-footer">
      <span>${p.soulCard ? "联动人设：" + escapeHtml(p.soulCard) : "不改变当前人设"}</span>
      <div class="mini-actions"></div>
    </div>
  `;

  if (p.group === "custom") {
    const actions = card.querySelector(".mini-actions");
    const editBtn = document.createElement("button");
    editBtn.className = "link-btn";
    editBtn.textContent = "编辑";
    editBtn.onclick = (e) => { e.stopPropagation(); openModal(p); };

    const delBtn = document.createElement("button");
    delBtn.className = "link-btn danger";
    delBtn.textContent = "删除";
    delBtn.onclick = (e) => { e.stopPropagation(); deletePreset(p); };

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
  }
  return card;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderSentinelSignal() {
  const el = document.getElementById("sentinelSignalText");
  if (!el) return;
  const sig = state.sentinelSignal;
  if (!sig) {
    el.textContent = "监测信号：暂无记录";
    el.style.color = "var(--muted)";
    return;
  }
  const parts = [];
  parts.push(sig.compactedAt ? `最近压缩：${String(sig.compactedAt).replace("T", " ").slice(0, 19)}` : "最近压缩：尚未执行");
  if (sig.needCompact) {
    parts.push(sig.pendingAt ? "待压缩：已派发，等待结算" : "待压缩：已标记待压缩");
  } else {
    parts.push("待压缩：无");
  }
  const failCount = Math.max(0, Number(sig.failCount) || 0);
  parts.push(`失败熔断：${failCount} 次`);
  if (sig.lastError) parts.push(`最近错误：${sig.lastError}`);
  el.textContent = "监测信号 · " + parts.join("　|　");
  el.style.color = failCount > 0 ? "var(--danger)" : "var(--muted)";
}

function render() {
  document.getElementById("chkReinforce").checked = state.perTurnReinforce;
  const active = state.presets.find((p) => p.id === state.activeId);
  document.getElementById("statusText").textContent = active ? `当前：${active.name}` : "";
  try { window.AzureTone?.applySeed(active ? (active.soulCard || active.id || active.name) : "standard"); } catch {}

  if (state.sentinel) {
    document.getElementById("chkSentinel").checked = state.sentinel.enabled !== false;
    document.getElementById("rngWarn").value = state.sentinel.warnPercent;
    document.getElementById("valWarn").textContent = state.sentinel.warnPercent + "%";
    document.getElementById("rngCrit").value = state.sentinel.criticalPercent;
    document.getElementById("valCrit").textContent = state.sentinel.criticalPercent + "%";
    document.getElementById("selWindow").value = String(state.sentinel.contextWindowTokens || 200000);
    document.getElementById("chkAutoCompact").checked = state.sentinel.autoCompactEnabled === true;
    document.getElementById("chkAutoExtract").checked = state.sentinel.autoExtractToLingshu !== false;
  }
  renderSentinelSignal();
  if (state.session) {
    const s = state.session;
    const k = Math.round((s.estimatedTokens || 0) / 1000);
    const maxK = Math.round((s.contextWindowTokens || 200000) / 1000);
    document.getElementById("meterLabel").textContent = s.found
      ? `当前会话估算：约 ${k}k / ${maxK}k (${s.percent}%)`
      : "当前会话估算：暂无活跃记录";
    const fill = document.getElementById("meterFill");
    fill.style.width = (s.percent || 0) + "%";
    fill.className = "meter-fill" + (s.level === "critical" ? " critical" : s.level === "warn" ? " warn" : "");
    const badge = document.getElementById("sentinelBadge");
    badge.textContent = s.level === "critical" ? "建议立刻 /compact" : s.level === "warn" ? "接近预警线" : "状态健康";
  }

  const bGrid = document.getElementById("builtinGrid");
  const cGrid = document.getElementById("customGrid");
  bGrid.innerHTML = "";
  cGrid.innerHTML = "";

  for (const p of state.presets) {
    const el = renderCard(p);
    if (p.group === "builtin") bGrid.appendChild(el);
    else cGrid.appendChild(el);
  }

  const addCard = document.createElement("div");
  addCard.id = "btnNew";
  addCard.className = "card card-add";
  addCard.setAttribute("role", "button");
  addCard.setAttribute("tabindex", "0");
  addCard.innerHTML = `
    <div class="card-add-icon">+</div>
    <div class="card-add-title">新建预设</div>
    <div class="card-add-desc">点击添加自定义模式</div>
  `;
  addCard.onclick = () => openModal(null);
  addCard.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(null); } };
  cGrid.appendChild(addCard);
}

async function load() {
  state = await api("/api/state");
  render();
}

let _activatingPreset = false;
async function activatePreset(id) {
  if (_activatingPreset) return;
  _activatingPreset = true;
  try {
    const res = await api("/api/activate", { method: "POST", body: JSON.stringify({ id }) });
    await load();
    let extra = "";
    if (res.soulSync?.synced) extra = `（已联动人设：${res.soulSync.card}）`;
    else if (res.soulSync && res.soulSync.error) extra = `（人设联动失败：${res.soulSync.error}）`;
    showToast(`已切换到：${res.active.name}${extra}`);
  } catch (e) {
    showToast(e.message);
  } finally {
    _activatingPreset = false;
  }
}

let pendingDeletePreset = null;

function openDeleteConfirm(preset) {
  pendingDeletePreset = preset;
  const label = preset?.name ? `${preset.name}（${preset.id}）` : String(preset?.id || "");
  document.getElementById("confirmDesc").textContent = `确定要删除自定义预设「${label}」吗？`;
  const activeWarn = document.getElementById("confirmActiveWarn");
  if (activeWarn) {
    activeWarn.style.display = preset?.id === state.activeId ? "block" : "none";
  }
  const okBtn = document.getElementById("btnConfirmOk");
  if (okBtn) {
    okBtn.disabled = false;
    okBtn.textContent = "确认删除";
  }
  document.getElementById("confirmModalMask").classList.add("open");
}

function closeDeleteConfirm() {
  pendingDeletePreset = null;
  document.getElementById("confirmModalMask").classList.remove("open");
}

async function deletePreset(presetOrId) {
  const preset = typeof presetOrId === "string"
    ? (state.presets.find((p) => p.id === presetOrId) || { id: presetOrId, name: presetOrId })
    : presetOrId;
  if (!preset?.id) return;
  openDeleteConfirm(preset);
}

async function executeDeletePreset() {
  const target = pendingDeletePreset;
  if (!target?.id) return;
  const okBtn = document.getElementById("btnConfirmOk");
  if (okBtn) {
    okBtn.disabled = true;
    okBtn.textContent = "删除中...";
  }
  try {
    await api(`/api/presets/${encodeURIComponent(target.id)}`, { method: "DELETE" });
    closeDeleteConfirm();
    await load();
    showToast(`已删除预设：${target.name || target.id}`);
  } catch (e) {
    if (okBtn) {
      okBtn.disabled = false;
      okBtn.textContent = "确认删除";
    }
    showToast(e.message || "删除失败");
  }
}

document.getElementById("btnConfirmCancel").onclick = closeDeleteConfirm;
document.getElementById("btnConfirmOk").onclick = executeDeletePreset;
document.getElementById("confirmModalMask").onclick = (e) => {
  if (e.target && e.target.id === "confirmModalMask") closeDeleteConfirm();
};
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("confirmModalMask").classList.contains("open")) {
    closeDeleteConfirm();
  }
});

function openModal(preset = null) {
  document.getElementById("modalTitle").textContent = preset ? "编辑自定义预设" : "新建自定义预设";
  document.getElementById("fId").value = preset ? preset.id : "";
  document.getElementById("fId").disabled = Boolean(preset);
  document.getElementById("fName").value = preset ? preset.name : "";
  document.getElementById("fDesc").value = preset ? preset.description : "";
  document.getElementById("fSoul").value = preset ? (preset.soulCard || "") : "";
  document.getElementById("fAnchor").value = preset ? (preset.anchor || "") : "";
  document.getElementById("modalMask").classList.add("open");
}

function closeModal() {
  document.getElementById("modalMask").classList.remove("open");
}

document.getElementById("chkReinforce").onchange = async (e) => {
  await api("/api/toggle", { method: "POST", body: JSON.stringify({ perTurnReinforce: e.target.checked }) });
  state.perTurnReinforce = e.target.checked;
  showToast(e.target.checked ? "已开启每轮前置强化" : "已关闭每轮前置强化");
};

async function saveSentinel() {
  const payload = {
    enabled: document.getElementById("chkSentinel").checked,
    warnPercent: Number(document.getElementById("rngWarn").value),
    criticalPercent: Number(document.getElementById("rngCrit").value),
    contextWindowTokens: Number(document.getElementById("selWindow").value),
    autoCompactEnabled: document.getElementById("chkAutoCompact").checked,
    autoExtractToLingshu: document.getElementById("chkAutoExtract").checked
  };
  const res = await api("/api/sentinel", { method: "POST", body: JSON.stringify(payload) });
  state.sentinel = res.sentinel;
  state.session = res.session;
  render();
  showToast("上下文监测设置已保存");
}
document.getElementById("chkSentinel").onchange = saveSentinel;
document.getElementById("chkAutoCompact").onchange = saveSentinel;
document.getElementById("chkAutoExtract").onchange = saveSentinel;
document.getElementById("rngWarn").oninput = (e) => (document.getElementById("valWarn").textContent = e.target.value + "%");
document.getElementById("rngCrit").oninput = (e) => (document.getElementById("valCrit").textContent = e.target.value + "%");
document.getElementById("rngWarn").onchange = saveSentinel;
document.getElementById("rngCrit").onchange = saveSentinel;
document.getElementById("selWindow").onchange = saveSentinel;
document.getElementById("btnResetBreaker").onclick = async () => {
  try {
    const res = await api("/api/sentinel/reset", { method: "POST" });
    state.sentinelSignal = res.sentinelSignal;
    renderSentinelSignal();
    showToast("已重置上下文监测熔断状态");
  } catch (e) {
    showToast(e.message);
  }
};

let sidebarNavPlugins = [];
function renderSidebarNavList() {
  const box = document.getElementById("sidebarNavList");
  const summary = document.getElementById("sidebarNavSummary");
  if (!box) return;
  const onCount = sidebarNavPlugins.filter((p) => p.showInLeftSidebar).length;
  if (summary) summary.textContent = `${onCount}/${sidebarNavPlugins.length} 已显示`;
  box.innerHTML = sidebarNavPlugins.map((p) => `
    <label style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2,rgba(128,128,128,0.08));cursor:pointer;">
      <div style="min-width:0;">
        <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.title)}</div>
        <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(p.desc || p.id)}</div>
      </div>
      <input type="checkbox" data-sb-plugin="${escapeHtml(p.id)}" ${p.showInLeftSidebar ? "checked" : ""} style="width:auto;cursor:pointer;flex-shrink:0;" />
    </label>
  `).join("");
  box.querySelectorAll("input[data-sb-plugin]").forEach((chk) => {
    chk.onchange = async () => {
      const pid = chk.getAttribute("data-sb-plugin");
      const next = chk.checked;
      chk.disabled = true;
      try {
        const res = await api("/api/sidebar-nav", {
          method: "POST",
          body: JSON.stringify({ pluginId: pid, showInLeftSidebar: next })
        });
        sidebarNavPlugins = res.plugins || sidebarNavPlugins;
        renderSidebarNavList();
        if (pid === "agent-presets") {
          const topBtn = document.getElementById("agy-sb-btn");
          if (topBtn) {
            topBtn.classList.toggle("is-on", next);
            topBtn.textContent = next ? "左侧栏: 开" : "左侧栏: 关";
          }
        }
        showToast((next ? "已开启" : "已隐藏") + "左侧栏按钮" + (res.refreshed ? "（已通知刷新，未变化时按 Ctrl+R）" : "（按 Ctrl+R 生效）"));
      } catch (e) {
        chk.checked = !next;
        showToast("切换失败：" + e.message);
      } finally {
        chk.disabled = false;
      }
    };
  });
}

async function loadSidebarNavList() {
  try {
    const res = await api("/api/sidebar-nav");
    sidebarNavPlugins = res.plugins || [];
    renderSidebarNavList();
  } catch (e) {
    const summary = document.getElementById("sidebarNavSummary");
    const box = document.getElementById("sidebarNavList");
    if (summary) summary.textContent = "待重启生效";
    if (box) box.innerHTML = `<div style="font-size:12px;color:var(--muted);">后台服务尚未加载新接口（${escapeHtml(e?.message || "请重启 Antigravity 或重载插件")}）</div>`;
  }
}
window.addEventListener("agy-sidebar-nav-changed", () => loadSidebarNavList());
loadSidebarNavList();

document.getElementById("btnCancel").onclick = closeModal;
document.getElementById("btnConfig").onclick = async () => {
  await api("/api/open-config", { method: "POST" });
  showToast("已打开配置文件");
};
document.getElementById("btnSave").onclick = async () => {
  try {
    await api("/api/presets", {
      method: "POST",
      body: JSON.stringify({
        id: document.getElementById("fId").value,
        name: document.getElementById("fName").value,
        description: document.getElementById("fDesc").value,
        soulCard: document.getElementById("fSoul").value,
        anchor: document.getElementById("fAnchor").value
      })
    });
    closeModal();
    await load();
    showToast("预设已保存");
  } catch (e) {
    showToast(e.message);
  }
};

function applyTheme(t) {
  const mode = t === "light" ? "light" : "dark";
  if (mode === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  const btn = document.getElementById("btnTheme");
  if (btn) {
    btn.textContent = mode === "light" ? "🌙" : "☀️";
    btn.title = mode === "light" ? "切换到深色主题" : "切换到浅色主题";
  }
  try { localStorage.setItem("azure_compass_theme", mode); } catch {}
}

document.getElementById("btnTheme").onclick = () => {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  applyTheme(isLight ? "dark" : "light");
};

document.getElementById("btnRefresh").onclick = async () => {
  const btn = document.getElementById("btnRefresh");
  btn.classList.add("spinning");
  try {
    await load();
    showToast("已刷新最新状态");
  } finally {
    setTimeout(() => btn.classList.remove("spinning"), 260);
  }
};

try { applyTheme(localStorage.getItem("azure_compass_theme") || "dark"); } catch {}
load();
</script>

<!-- AGY_UPDATE_CHECKER_WIDGET -->
<style>
  .agy-upd-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border, #2a334a);
    background: var(--panel-2, var(--card, rgba(128,128,128,0.12)));
    color: var(--muted, #94a3b8);
    font-size: 11px;
    line-height: 1.2;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, transform .12s;
  }
  .agy-upd-btn:hover {
    border-color: var(--accent, #58a6ff);
    color: var(--text, #e6ecf8);
    transform: translateY(-1px);
  }
  .agy-upd-btn:active { transform: scale(0.96); }
  .agy-upd-btn.has-update {
    border-color: #f59e0b;
    background: rgba(245, 158, 11, 0.16);
    color: #fbbf24;
    font-weight: 600;
  }
  [data-theme="light"] .agy-upd-btn.has-update {
    color: #b45309;
    background: rgba(245, 158, 11, 0.14);
  }
  .agy-upd-toast {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.94);
    color: #f8fafc;
    border: 1px solid rgba(96, 165, 250, 0.45);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
  }
  .agy-upd-toast.show { opacity: 1; }
</style>
<script>
(function initAgyUpdateChecker() {
  if (window.__agyUpdateCheckerInit) return;
  window.__agyUpdateCheckerInit = true;
  const tok = new URLSearchParams(location.search).get("token") || "";
  let lastInfo = null;

  function showTip(msg) {
    if (typeof window.toast === "function") return window.toast(msg);
    if (typeof window.showToast === "function") return window.showToast(msg);
    let el = document.getElementById("agy-upd-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "agy-upd-toast";
      el.className = "agy-upd-toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function mountBtn() {
    const btn = document.createElement("button");
    btn.id = "agy-upd-btn";
    btn.type = "button";
    btn.className = "agy-upd-btn";
    btn.textContent = "检查更新";
    btn.title = "点击检查 GitHub 最新版本";
    const host =
      document.querySelector(".header-actions") ||
      document.querySelector("header .row") ||
      document.querySelector(".header .actions") ||
      document.querySelector(".topbar-actions") ||
      document.querySelector(".hdr-actions") ||
      document.querySelector("header");
    if (host) {
      host.insertBefore(btn, host.firstChild);
    } else {
      btn.style.position = "fixed";
      btn.style.top = "10px";
      btn.style.right = "12px";
      btn.style.zIndex = "999";
      document.body.appendChild(btn);
    }
    btn.onclick = async () => {
      if (lastInfo && lastInfo.hasUpdate && lastInfo.releaseUrl) {
        try { await navigator.clipboard?.writeText(lastInfo.releaseUrl); } catch {}
        try { window.open(lastInfo.releaseUrl, "_blank", "noopener"); } catch {}
        showTip("发现新版本 v" + lastInfo.latestVersion + "，已复制发布页链接（git pull 即可更新）");
        return;
      }
      btn.textContent = "检查中...";
      const info = await fetchUpdate(true);
      if (!info || !info.ok) {
        showTip("检查更新失败：" + (info?.error || "网络异常"));
      } else if (info.hasUpdate) {
        showTip("发现新版本 v" + info.latestVersion + "（当前 v" + info.currentVersion + "），再次点击打开下载页");
      } else {
        showTip("已是最新版本 v" + info.currentVersion);
      }
    };
    return btn;
  }

  async function fetchUpdate(force) {
    try {
      const headers = {};
      if (tok) headers["X-Codeium-Sidecar-Token"] = tok;
      const r = await fetch("/api/check-update" + (force ? "?force=1" : ""), { headers });
      const data = await r.json();
      lastInfo = data;
      const btn = document.getElementById("agy-upd-btn");
      if (btn && data) {
        if (data.hasUpdate) {
          btn.classList.add("has-update");
          btn.textContent = "⬆ v" + data.latestVersion;
          btn.title = "发现新版本 v" + data.latestVersion + "（当前 v" + data.currentVersion + "），点击打开/复制 Release 链接";
        } else {
          btn.classList.remove("has-update");
          btn.textContent = "v" + (data.currentVersion || "?");
          btn.title = data.ok ? ("已是最新版本 v" + data.currentVersion + "（点击重新检查）") : ("当前 v" + data.currentVersion + "（点击检查更新）");
        }
      }
      return data;
    } catch {
      return null;
    }
  }

  function start() {
    mountBtn();
    setTimeout(() => fetchUpdate(false), 600);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
